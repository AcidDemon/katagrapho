[package]
name = "katagrapho"
version = "0.3.0"
edition = "2024"
description = "Setgid+setuid binary for tamper-proof session recording with age encryption"
license = "MIT"

[[bin]]
name = "katagrapho"
path = "src/main.rs"

[[bin]]
name = "katagrapho-verify"
path = "bin/katagrapho-verify.rs"

[[bin]]
name = "katagrapho-keygen"
path = "bin/katagrapho-keygen.rs"

[dependencies]
libc = "0.2"
age = { version = "0.11", default-features = false }
thiserror = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
age = { version = "0.11", default-features = false, features = ["armor"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
overflow-checks = true
